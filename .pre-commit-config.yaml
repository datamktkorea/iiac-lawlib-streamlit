repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      # Run the linter
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi]
