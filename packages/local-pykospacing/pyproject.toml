[project]
name = "pykospacing"
version = "0.5"
description = "Spacing for Korean"
dependencies = [
    "tensorflow",
    "h5py",
    "argparse",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pykospacing"]

[tool.setuptools.package-data]
pykospacing = ["resources/**/*"]
